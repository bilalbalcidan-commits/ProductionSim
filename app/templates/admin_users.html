{% extends "base.html" %}
{% block content %}
<h2>Admin - Users</h2>
<div class="card">
  <h3>Create User</h3>
  <form method="post">
    <label>Email</label>
    <input name="email" type="email" required />
    <label>Password</label>
    <input name="password" type="password" required />
    <label>Role</label>
    <select name="role">
      {% for r in roles %}
        <option value="{{ r.value }}">{{ r.value }}</option>
      {% endfor %}
    </select>
    <label>Factories (multi-select)</label>
    <select name="factory_ids" multiple>
      {% for f in factories %}
        <option value="{{ f.id }}">{{ f.name }}</option>
      {% endfor %}
    </select>
    <button type="submit">Create</button>
  </form>
</div>

<div class="card">
  <h3>Users</h3>
  <table>
    <thead><tr><th>Email</th><th>Role</th><th>Active</th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td class="mono">{{ u.email }}</td>
        <td class="mono">{{ u.role.value }}</td>
        <td class="mono">{{ "Y" if u.is_active else "N" }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
