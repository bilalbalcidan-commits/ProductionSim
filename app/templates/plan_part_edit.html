{% extends "base.html" %}
{% block content %}
<h2>Edit Part - {{ part.part_code }}</h2>
<div class="card">
  <form method="post">
    <label>Name</label>
    <input name="name" value="{{ part.name }}" />
    <label>Weekly Target Qty</label>
    <input name="weekly_target_qty" type="number" value="{{ part.weekly_target_qty }}" />
    <label>Line</label>
    <input name="line" value="{{ part.line or '' }}" />
    <label>Product Family</label>
    <input name="product_family" value="{{ part.product_family or '' }}" />
    <label>Release Datetime (ISO)</label>
    <input name="release_datetime" value="{{ part.release_datetime or '' }}" />
    <label>Active</label>
    <input name="active" type="checkbox" {% if part.active %}checked{% endif %} />
    <button type="submit">Save</button>
  </form>
</div>
{% endblock %}
