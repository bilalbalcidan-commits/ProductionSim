{% extends "base.html" %}
{% block content %}
<h2>Production Dashboard</h2>
<form method="get" class="inline">
  <label>Factory</label>
  <select name="factory_id" onchange="this.form.submit()">
    {% for f in factories %}
      <option value="{{ f.id }}" {% if f.id == selected_factory %}selected{% endif %}>{{ f.name }}</option>
    {% endfor %}
  </select>
</form>

<div class="card">
  <form method="post" action="/api/run">
    <input type="hidden" name="factory_id" value="{{ selected_factory }}" />
    <button type="submit">Run Simulation</button>
  </form>
</div>

<div class="card">
  <h3>Recent Runs</h3>
  <table>
    <thead><tr><th>ID</th><th>Status</th><th>Created</th><th>Dashboard</th></tr></thead>
    <tbody>
      {% for r in runs %}
      <tr>
        <td class="mono">{{ r.id }}</td>
        <td class="mono">{{ r.status }}</td>
        <td class="mono">{{ r.created_at }}</td>
        <td>
          {% if r.dashboard_html_path %}
            <a href="/reports/{{ r.id }}/dashboard" target="_blank">Open</a>
          {% else %}
            -
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<div class="card">
  <h3>Add Note</h3>
  <form method="post" action="/prod/notes">
    <input type="hidden" name="factory_id" value="{{ selected_factory }}" />
    <label>Run ID</label>
    <input name="run_id" type="number" required />
    <label>Machine ID</label>
    <input name="machine_id" required />
    <label>Note</label>
    <textarea name="note" rows="3"></textarea>
    <button type="submit">Add Note</button>
  </form>
</div>
{% endblock %}
